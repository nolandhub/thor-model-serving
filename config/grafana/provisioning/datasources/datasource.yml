# ABOUTME: Datasource Prometheus, uid cố định để dashboard JSON trỏ thẳng vào
# ABOUTME: Tên service trong compose network - không phụ thuộc cổng host

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
