# ABOUTME: Prometheus + Grafana cho Thor - bind loopback vì máy dùng chung, xem qua SSH tunnel (-L 3300:localhost:3000)
# ABOUTME: Dùng: ./scripts/thor/deploy_monitoring.sh

services:
  prometheus:
    # :latest chứ không ghim version như repo gốc (triton-voice-serving) từng
    # làm: registry-1.docker.io bị chặn từ Thor, :latest là bản duy nhất đã
    # nằm sẵn trong cache local. Ghim version cụ thể ở đây sẽ pull fail.
    image: prom/prometheus:latest
    container_name: thor-voice-prometheus
    restart: unless-stopped
    # host network để thấy :9002 của asr Triton mà không cần bridge/host.docker.internal
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Thor là máy dùng chung nhiều người - không phơi ra LAN, chỉ vào được
      # qua SSH tunnel. Grafana vẫn gọi được vì network_mode: host nên
      # localhost:9090 là cùng một loopback.
      - --web.listen-address=127.0.0.1:9090

  grafana:
    # Cùng lý do: :latest là bản duy nhất Thor đã có sẵn, Docker Hub không kéo được.
    image: grafana/grafana:latest
    container_name: thor-voice-grafana
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      # Chỉ vào được qua SSH tunnel -> đúng một người dùng mỗi lần, anonymous-
      # admin ở đây không phải lỗ hổng LAN như trên máy dev có network_mode mở.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

volumes:
  prometheus-data:
  grafana-data:
